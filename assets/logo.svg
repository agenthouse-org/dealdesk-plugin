<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="DealDesk">
  <!-- ~20% padding so marketplace tiles do not clip the mark -->
  <rect width="128" height="128" rx="28" fill="#0F2A2E"/>
  <g transform="translate(28, 30)">
    <!-- stacked desk cards -->
    <rect x="8" y="4" width="56" height="40" rx="6" fill="#1C4A52"/>
    <rect x="0" y="14" width="56" height="40" rx="6" fill="#2F6F78"/>
    <rect x="0" y="14" width="56" height="40" rx="6" fill="none" stroke="#8FD0D6" stroke-width="2"/>
    <!-- accent bar / deal signal -->
    <rect x="10" y="26" width="28" height="5" rx="2.5" fill="#E8F4F5"/>
    <rect x="10" y="36" width="18" height="5" rx="2.5" fill="#8FD0D6"/>
    <!-- check mark -->
    <path d="M42 34l5 5 10-12" fill="none" stroke="#F4C15D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
